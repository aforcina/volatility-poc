<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Volatility Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 8px; }
  </style>
</head>
<body>
  <h3>Volatility Smile (selected maturity)</h3>
  <canvas id="chart" width="800" height="400"></canvas>

  <script>
    const ctx = document.getElementById('chart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Implied Vol',
          borderColor: 'rgba(75, 192, 192, 1)',
          data: [],
          tension: 0.2
        }]
      },
      options: { scales: { x: { title: { display: true, text: 'Strike' } }, y: { title: { display: true, text: 'Implied Vol' } } } }
    });

    window.chrome?.webview?.addEventListener('message', ev => {
      try {
        const snapshot = JSON.parse(ev.data);
        if (!snapshot || snapshot.length === 0) return;
        const maturity = snapshot[0].maturity;
        const points = snapshot.filter(p => p.maturity === maturity);
        points.sort((a,b) => a.strike - b.strike);

        chart.data.labels = points.map(p => p.strike);
        chart.data.datasets[0].data = points.map(p => p.vol);
        chart.update();
      } catch (e) {
        console.error(e);
      }
    });
  </script>
</body>
</html>
